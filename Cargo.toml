[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/scenario-runner", "crates/sim-viewer"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
